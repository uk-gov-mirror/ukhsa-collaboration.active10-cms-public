name: "Build, Test and Release"

on:
  pull_request:
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  actions: read
  pull-requests: write

jobs:
  prepare-release-tag:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.export.outputs.release_tag }}
    steps:
      - name: Checkout repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Bump tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: bump
        uses: ukhsa-collaboration/devops-github-actions/.github/actions/github-bump-tag@52f31c5544ee5204dd0e169728c595b6a402205f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true

      - name: Export release tag
        id: export
        run: echo "release_tag=${{ steps.bump.outputs.new_tag }}" >> "$GITHUB_OUTPUT"

  container-image:
    name: Build, Test and Release
    needs: prepare-release-tag
    permissions:
      contents: write
      id-token: write
      actions: read
      pull-requests: write
    uses: ukhsa-collaboration/devops-application-cicd/.github/workflows/container-image-build-python-aws-ecs.yml@a1f9c3c4077074c854ef2b912812dcf947b88381 # v0.0.16
    with:
      app_name: ${{ vars.APP_NAME }}
      service_identifier: ${{ vars.ECR_NAMESPACE }}
      aws_region: ${{ vars.AWS_REGION }}
      # actions/python-versions has no 3.11.x build for Ubuntu 26.04 (ubuntu-latest).
      runner_labels: '["ubuntu-24.04"]'
      run_unit_tests: ${{ vars.RUN_UNIT_TESTS == 'true' }}
      push_image: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      release_tag: ${{ needs.prepare-release-tag.outputs.release_tag }}
      lint_dockerfile: false
      lint_python: false
      registry_account_id: "636728427214"
      aws_registry_role_name: "github-active-10-cms-ecr"
      post_deploy_test_command: |
        python -m pip install -r tests/integration/requirements.txt
        python -m pytest -c pyproject.toml tests/integration -m "not authenticated and not admin_write and not debug_docs" --require-content --junitxml=test-results/integration.xml
        # Dev overrides these tests to allow empty content and exclude integrity checks.
      deploy_environments: >-
        [
          { "name": "dev", "base_url": "https://active10.dev.phedigital.co.uk", "smoke_test_url": "https://active10.dev.phedigital.co.uk/healthcheck", "predeploy_script": "scripts/collectstatic_predeploy.sh", "post_deploy_test_command": "python -m pip install -r tests/integration/requirements.txt && python -m pytest -c pyproject.toml tests/integration -m \"not authenticated and not admin_write and not debug_docs and not integrity\" --junitxml=test-results/integration.xml" },
          { "name": "uat", "base_url": "https://active10.stg.phedigital.co.uk", "smoke_test_url": "https://active10.stg.phedigital.co.uk/healthcheck", "predeploy_script": "scripts/collectstatic_predeploy.sh" },
          { "name": "prd", "base_url": "https://active10.prod.phedigital.co.uk", "smoke_test_url": "https://active10.prod.phedigital.co.uk/healthcheck", "predeploy_script": "scripts/collectstatic_predeploy.sh" }
        ]
    secrets: inherit # pragma: allowlist secret
